name: ci
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                go-version-file: go.mod
                cache: true
            - run: go vet ./...
            - run: go test ./...
            - run: go run . tree --check
              name: "README tree is current"
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                go-version-file: go.mod
                cache: true
            - uses: golangci/golangci-lint-action@v8
              with: 
                version: v2.5