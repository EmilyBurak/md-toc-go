name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs: 
  goreleaser:
    name: release
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v5
          with:
              fetch-depth: 0
        - uses: actions/setup-go@v6
          with:
              go-version-file: go.mod
              cache: true
        - name: test
          run: go test ./...
        - uses: golangci/golangci-lint-action@v8
          with: 
              version: "v2.5"
        - uses: goreleaser/goreleaser-action@v6
          with: 
              version: "~> v2"
              args: release --clean
          env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
